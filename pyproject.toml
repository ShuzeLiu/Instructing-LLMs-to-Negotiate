[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instructing-llms-to-negotiate"
version = "1.0.0"
description = "Training an LLM buyer to negotiate with reinforcement learning from verifiable rewards"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "tinker==0.38.0",
    "tinker-cookbook==0.6.0",
    "chz>=0.4.0",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["negotiation_rl"]
